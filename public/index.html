<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mehra Share</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Top Right Header Controls -->
  <header class="app-header">
    <div class="header-right">
      <button id="themeToggleBtn" class="header-btn" title="Toggle Theme">☀️</button>
      <button id="helpTorchBtn" class="header-btn help-btn" title="Help">🔦 Help</button>
    </div>
  </header>

  <!-- Dual Searchlight Batman Overlay -->
  <div id="batSignalOverlay" class="batsignal-overlay hidden">
    <!-- Left & Right Spotlight Beams converging to Center -->
    <div class="light-beam beam-left"></div>
    <div class="light-beam beam-right"></div>
    <div class="center-spotlight-glow"></div>

    <!-- Center Stage: 3D Batman + Help Card -->
    <div class="bat-stage">
      <div class="batman-logo-3d">
        <svg viewBox="0 0 500 300" class="bat-svg">
          <path d="M 250,55 C 242,40 236,20 234,0 C 230,12 216,35 192,30 C 160,24 100,50 65,95 C 25,145 0,210 20,245 C 50,210 95,200 135,215 C 165,226 195,260 215,300 C 220,270 235,250 250,250 C 265,250 280,270 285,300 C 305,260 335,226 365,215 C 405,200 450,210 480,245 C 500,210 475,145 435,95 C 400,50 340,24 308,30 C 284,35 270,12 266,0 C 264,20 258,40 250,55 Z" />
        </svg>
      </div>

      <div class="help-popup-card">
        <h3>Mehra Share Help</h3>
        <p>1. <b>Bhejna:</b> File choose karein aur direct link dost ko bhejein.</p>
        <p>2. <b>Receive:</b> Dost link khole aur instant connect ho jayega.</p>
        <p>3. <b>6 GB Stream:</b> Transfer poora hone tak browser tab khula rakhein.</p>
      </div>
    </div>
  </div>

  <!-- Main App Box -->
  <main class="main-container">
    <div class="app-card">
      <h1 class="brand-title">Mehra Share</h1>
      <p class="tagline">Fast peer-to-peer file sharing between devices</p>

      <div class="action-grid">
        <button id="sendViewBtn" class="core-btn primary-btn">Bhejna hai (Send)</button>
        <button id="receiveViewBtn" class="core-btn secondary-btn">Receive Karna hai</button>
      </div>

      <div id="senderSection" class="section-box hidden">
        <label class="drop-zone" for="fileInput">
          <span id="fileLabel">📁 File choose karein (Max 6 GB)</span>
          <input type="file" id="fileInput" />
        </label>
        <button id="generateLinkBtn" class="core-btn action-submit-btn">Share Link Generate Karein</button>
        <div id="shareLinkContainer" class="share-box hidden">
          <input type="text" id="shareUrlInput" readonly />
          <button id="copyLinkBtn" class="core-btn">Copy</button>
        </div>
      </div>

      <div id="receiverSection" class="section-box hidden">
        <input type="text" id="roomCodeInput" class="text-input" placeholder="6-digit code enter karein" />
        <button id="connectRoomBtn" class="core-btn action-submit-btn">Connect & Download</button>
      </div>

      <div id="statusContainer" class="status-box hidden">
        <p id="statusText">Connecting...</p>
        <div class="progress-bar-bg"><div id="progressFill" class="progress-bar-fill"></div></div>
      </div>
    </div>
  </main>

  <script src="/client.js"></script>
</body>
</html>
